<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Magverse" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="manifest" href="/manifest.json" />
    <title>The Magverse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root{
        --bg:#0a0a0f;
        --surface-1:#111118;
        --surface-2:#1a1a24;
        --border:#1e1e2e;
        --text:#e2e8f0;
        --muted:#94a3b8;
        --subtle:#64748b;
        --accent-from:#6366f1; /* indigo */
        --accent-to:#8b5cf6;   /* violet */
      }
      html,body,#root{height:100%;}
      body{font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--bg); color:var(--text);}
      .glass{background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.04); backdrop-filter:blur(6px);}
      .accent-grad{background:linear-gradient(90deg,var(--accent-from),var(--accent-to));}
      .border-subtle{border:1px solid var(--border)}

      /* Ornaments and ambiance */
      .bg-ornaments{position:fixed;inset:0;z-index:0;overflow:hidden}
      .orb{position:absolute;filter:blur(70px);opacity:0.18;mix-blend-mode:screen}
      .orb-1{width:520px;height:520px;border-radius:50%;left:-10%;top:-8%;background:radial-gradient(circle at 30% 30%, var(--accent-from), transparent 40%)}
      .orb-2{width:420px;height:420px;border-radius:50%;right:-6%;top:10%;background:radial-gradient(circle at 70% 40%, var(--accent-to), transparent 40%)}
      .orb-3{width:300px;height:300px;border-radius:50%;left:20%;bottom:-10%;background:radial-gradient(circle at 40% 60%, rgba(139,92,246,0.9), transparent 40%)}
      .dot-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);background-size:16px 16px;opacity:0.03}

      /* Animations */
      @keyframes float1{0%{transform:translateY(0)}50%{transform:translateY(-12px)}100%{transform:translateY(0)}}
      @keyframes float2{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
      .orb-1{animation:float1 8s ease-in-out infinite}
      .orb-2{animation:float2 10s ease-in-out infinite}
      .orb-3{animation:float1 12s ease-in-out infinite}

      /* Glass depths */
      .glass { transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease; }
      .glass.depth-1{background:rgba(255,255,255,0.03);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,0.6)}
      .glass.depth-2{background:rgba(255,255,255,0.02);backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,0.7)}

      /* Gradient borders via pseudo element */
      .border-gradient{position:relative}
      .border-gradient:before{content:'';position:absolute;inset:-1px;border-radius:8px;padding:1px;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));-webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);pointer-events:none}

      /* Interactive motion */
      button, .card, .nav-item { transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease }
      button:hover, .nav-item:hover { transform: translateY(-4px) scale(1.02) }
      button:active { transform: scale(.97) }

      /* List item mount animation */
      @keyframes fadeInUp{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      .animate-item{ animation:fadeInUp .36s cubic-bezier(.2,.8,.2,1) both }

      /* Removal animation */
      @keyframes slideOutRight{ from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(20px)} }
      .removing{ animation:slideOutRight .44s ease forwards }

      /* Toast action button style */
      .toast-action{ margin-left:8px; padding:4px 8px; border-radius:6px; background:linear-gradient(90deg,var(--accent-from),var(--accent-to)); color:white; font-weight:600 }

      /* Skeleton shimmer */
      .skeleton{ background:linear-gradient(90deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 100%); background-size:200% 100%; animation:shimmer 1.4s linear infinite }
      @keyframes shimmer{ from{background-position:200% 0} to{background-position:-200% 0} }

      /* Mic pulse */
      @keyframes pulse{ 0%{transform:scale(1);opacity:0.7} 50%{transform:scale(1.55);opacity:0} 100%{transform:scale(1.55);opacity:0} }

      /* Safe area padding for mobile notch/home bar */
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
  </head>
  <body>
    <div class="bg-ornaments pointer-events-none" aria-hidden>
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="dot-grid"></div>
    </div>
    <div id="root"></div>
    <div id="js-error-overlay" style="display:none;position:fixed;top:0;left:0;right:0;padding:20px;background:#1e0000;color:#ff6b6b;font-family:monospace;font-size:13px;z-index:99999;white-space:pre-wrap;border-bottom:2px solid #ff0000;"></div>
    <!-- Intercept console.error early so Babel parse errors appear in the overlay -->
    <script>
      (function() {
        var _orig = console.error.bind(console);
        console.error = function() {
          _orig.apply(console, arguments);
          var msg = Array.from(arguments).map(function(a){ return typeof a==='object'?JSON.stringify(a):String(a); }).join(' ');
          // Only show Babel/script errors, not React's internal noisy warnings
          if(msg.indexOf('[Babel]')!==-1 || msg.indexOf('SyntaxError')!==-1 || msg.indexOf('ReferenceError')!==-1 || msg.indexOf('TypeError')!==-1) {
            var d = document.getElementById('js-error-overlay');
            if(d) { d.style.display='block'; d.textContent = (d.textContent?d.textContent+'\n\n':'')+msg; }
          }
        };
      })();
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script type="text/babel" data-presets="react" src="./App.jsx?v=85"></script>
    <script>
      // Catch and display JS errors visually so we can diagnose blank-screen issues
      function showErr(msg) {
        const d = document.getElementById('js-error-overlay');
        if(d) { d.style.display = 'block'; d.textContent = (d.textContent ? d.textContent + '\n\n' : '') + msg; }
        console.error('[overlay]', msg);
      }
      window.addEventListener('error', function(e) {
        showErr('JS Error: ' + (e.message || 'unknown') + '\nFile: ' + (e.filename||'') + ':' + (e.lineno||'') + (e.error && e.error.stack ? '\n\nStack:\n' + e.error.stack : ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        showErr('Unhandled promise rejection: ' + (e.reason && (e.reason.stack || e.reason.message || e.reason) || 'unknown'));
      });
      // If root is still empty after 8s, React failed to mount — show message
      setTimeout(function() {
        var root = document.getElementById('root');
        if(root && root.childNodes.length === 0) {
          showErr('App failed to mount after 8 seconds. React did not render. Check console for Babel/JS errors.\nTip: open DevTools (F12) → Console to see the full error.');
        }
      }, 8000);
      // Register service worker after page loads; auto-reload when a new SW takes control
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            reg.update(); // force check for a newer SW on every load
          }).catch(() => {});
          // When a new SW activates and claims the page, reload to get fresh assets
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          });
        });
      }
      // Generate placeholder PWA icons via canvas (no external PNG needed)
      function makeIcon(size) {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0,0,size,size);
        g.addColorStop(0,'#6366f1'); g.addColorStop(1,'#8b5cf6');
        ctx.fillStyle = g; ctx.beginPath();
        ctx.roundRect(0,0,size,size,size*0.2); ctx.fill();
        ctx.fillStyle='#fff'; ctx.font=`bold ${size*0.45}px Inter,sans-serif`;
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('M',size/2,size/2+size*0.04);
        return c.toDataURL('image/png');
      }
      // Patch manifest icon srcs with generated data URIs
      window.addEventListener('load',()=>{
        [192,512].forEach(s=>{
          const link=document.createElement('link');
          link.rel='apple-touch-icon'; link.sizes=`${s}x${s}`; link.href=makeIcon(s);
          document.head.appendChild(link);
        });
      });
    </script>
  </body>
</html>
